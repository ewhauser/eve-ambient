packages:
  - "packages/*"
  - "examples/*"
  - "integration/*"

allowBuilds:
  "@swc/core": true
  cbor-extract: true
  esbuild: true

overrides:
  "brace-expansion@2.1.4": "2.1.7"
  "brace-expansion@5.0.9": "5.0.12"
  "devalue@5.9.0": "5.9.3"
  "http-cache-semantics@4.2.0": "4.3.0"
  "nanoid@5.1.6": "5.1.16"
  "piscina@4.9.3": "4.9.4"
  "proxy-addr@2.0.7": "2.0.8"
  "qs@6.15.3": "6.16.0"
  "source-map-js@1.2.1": "1.2.2"
  "undici@7.28.0": "7.29.1"
  "undici@7.29.0": "7.29.1"

# Hold new direct and transitive releases for one day. Security updates can
# still be selected explicitly when a faster upgrade is required.
minimumReleaseAge: 1440

# The official Eve adapter targets this exact release because it carries a
# package patch for durable channel-delivery identity. Consumers must apply
# the same patch; a dependency cannot activate pnpm patches for its host.
minimumReleaseAgeExclude:
  - "eve@0.71.2"

patchedDependencies:
  "eve@0.71.2": packages/eve-adapter/patches/eve@0.71.2.patch
