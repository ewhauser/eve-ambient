name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Create release commits, tags, and draft releases.
      issues: write # Apply labels to release pull requests.
      pull-requests: write # Create and update release pull requests.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create or update the release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  build:
    name: Build release package
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CI: "true"
      COREPACK_DEFAULT_TO_LATEST: "0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      EVE_AMBIENT_POSTGRES_URL: postgresql:///eve_ambient_test?host=/var/run/postgresql
    steps:
      - name: Check out released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Activate integrity-pinned pnpm
        run: |
          corepack enable pnpm
          corepack install
          pnpm --version

      - name: Start PostgreSQL conformance database
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres createuser --superuser runner
          sudo -u postgres createdb --owner=runner eve_ambient_test

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release source
        run: pnpm check

      - name: Pack release artifact
        run: pnpm pack:release

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-package
          path: release-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish package to npm
    needs:
      - release-please
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write # Authenticate to npm through trusted publishing.
    env:
      NPM_CONFIG_PROVENANCE: "true"
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-package
          path: release-artifacts

      - name: Verify and publish package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          tarballs=(release-artifacts/*.tgz)
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "Expected exactly one npm tarball" >&2
            exit 1
          fi

          tarball="${tarballs[0]}"
          checksum="${tarball}.sha256"
          test -f "${checksum}"
          (cd release-artifacts && sha256sum --check "$(basename "${checksum}")")

          metadata="$(tar -xOf "${tarball}" package/package.json)"
          package_name="$(node -e 'const data = JSON.parse(process.argv[1]); console.log(data.name)' "${metadata}")"
          package_version="$(node -e 'const data = JSON.parse(process.argv[1]); console.log(data.version)' "${metadata}")"

          if [[ "${package_name}" != "@ewhauser/eve-ambient" ]]; then
            echo "Refusing unexpected package: ${package_name}" >&2
            exit 1
          fi
          if [[ ! "${package_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing invalid package version: ${package_version}" >&2
            exit 1
          fi
          if [[ "${RELEASE_TAG}" != "v${package_version}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match ${package_name}@${package_version}" >&2
            exit 1
          fi

          local_integrity="$(node -e 'const { createHash } = require("node:crypto"); const { readFileSync } = require("node:fs"); console.log("sha512-" + createHash("sha512").update(readFileSync(process.argv[1])).digest("base64"))' "${tarball}")"
          view_error="$(mktemp)"
          if published_integrity="$(npm view "${package_name}@${package_version}" dist.integrity --json 2>"${view_error}")"; then
            published_integrity="$(node -e 'console.log(JSON.parse(process.argv[1]))' "${published_integrity}")"
            if [[ "${published_integrity}" != "${local_integrity}" ]]; then
              echo "Published ${package_name}@${package_version} has a different integrity" >&2
              exit 1
            fi
            echo "${package_name}@${package_version} is already published with matching integrity"
          elif grep -q "E404" "${view_error}"; then
            npm publish "${PWD}/${tarball}" --access public --ignore-scripts
          else
            cat "${view_error}" >&2
            exit 1
          fi
          rm -f "${view_error}"

  finalize:
    name: Publish immutable GitHub release
    needs:
      - release-please
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Attach assets and publish the draft GitHub release.
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-package
          path: release-artifacts

      - name: Attach artifact and publish release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          tarballs=(release-artifacts/*.tgz)
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "Expected exactly one npm tarball" >&2
            exit 1
          fi

          tarball="${tarballs[0]}"
          test -f "${tarball}.sha256"
          gh release upload "${RELEASE_TAG}" "${tarball}" "${tarball}.sha256" --clobber
          gh release edit "${RELEASE_TAG}" --draft=false
