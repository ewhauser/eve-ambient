packages:
  - "packages/*"
  - "examples/*"
  - "integration/*"

allowBuilds:
  "@swc/core": true
  cbor-extract: true
  esbuild: true

overrides:
  "nanoid@5.1.6": "5.1.16"
  "undici@7.28.0": "7.29.0"

# Hold new direct and transitive releases for one day. Security updates can
# still be selected explicitly when a faster upgrade is required.
minimumReleaseAge: 1440

# The official Eve adapter targets this exact release because it carries a
# package patch for durable channel-delivery identity. Consumers must apply
# the same patch; a dependency cannot activate pnpm patches for its host.
minimumReleaseAgeExclude:
  - "eve@0.71.2"

patchedDependencies:
  "eve@0.71.2": packages/eve-adapter/patches/eve@0.71.2.patch
