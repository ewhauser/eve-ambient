packages:
  - "packages/*"
  - "examples/*"
  - "integration/*"

allowBuilds:
  "@swc/core": true
  cbor-extract: true
  esbuild: true

overrides:
  "body-parser@2.3.0": "2.4.0"
  "brace-expansion@2.1.4": "2.1.7"
  "brace-expansion@5.0.9": "5.0.12"
  "devalue@5.9.0": "5.9.3"
  "http-cache-semantics@4.2.0": "4.3.0"
  "nanoid@5.1.6": "5.1.16"
  "piscina@4.9.3": "4.9.4"
  "proxy-addr@2.0.7": "2.0.8"
  "qs@6.15.3": "6.16.0"
  "source-map-js@1.2.1": "1.2.2"
  "undici@7.28.0": "7.30.1"
  "undici@7.29.0": "7.30.1"
  "undici@7.29.1": "7.30.1"
  "undici@8.10.2": "8.12.2"
  "vite@8.2.1": "8.2.4"
  "zod@4.1.11": "4.6.6"
  "zod@4.3.6": "4.6.6"
  "zod@4.4.3": "4.6.6"

# Hold new direct and transitive releases for one day. Security updates can
# still be selected explicitly when a faster upgrade is required.
minimumReleaseAge: 1440

# Pin the current stable Eve release for the adapter.
minimumReleaseAgeExclude:
  - "eve@0.83.0"
